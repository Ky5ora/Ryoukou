<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Baru - Rental Motor Ryokou</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/2.membuat password baru.css">
</head>
<body class="d-flex align-items-center justify-content-center py-4">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10 col-xl-9">
                <div class="card auth-card">
                    <div class="row g-0">
                        
                        <!-- Kolom Form (Di HP turun ke bawah, di Laptop di kiri) -->
                        <div class="col-md-6 p-4 p-md-5 d-flex flex-column justify-content-center order-2 order-md-1">
                            <h4 class="fw-bold mb-4">Silahkan Membuat<br>Password Baru Anda</h4>

                            <form id="formPasswordBaru">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold small">Buat Password:</label>
                                    <div class="password-container">
                                        <input type="password" id="inputSandiBaru" class="form-control form-control-custom" placeholder="•••••" required>
                                        <button type="button" class="toggle-password" onclick="toggleSandi('inputSandiBaru', 'imgMataBaru1')">
                                            <img id="imgMataBaru1" src="../assets/icon-mata-terbuka.svg" width="20" height="20" alt="Toggle Password">
                                        </button>
                                    </div>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label fw-semibold small">Konfirmasi Password:</label>
                                    <div class="password-container">
                                        <input type="password" id="inputKonfirmasiSandi" class="form-control form-control-custom" placeholder="•••••" required>
                                        <button type="button" class="toggle-password" onclick="toggleSandi('inputKonfirmasiSandi', 'imgMataBaru2')">
                                            <img id="imgMataBaru2" src="../assets/icon-mata-terbuka.svg" width="20" height="20" alt="Toggle Password">
                                        </button>
                                    </div>
                                </div>

                                <div class="row g-2">
                                    <div class="col-6">
                                        <button type="submit" class="btn btn-dark-custom w-100">Simpan</button>
                                    </div>
                                    <div class="col-6">
                                        <a href="1.verifikasi email login.html" class="btn btn-dark-custom w-100 text-center text-decoration-none">Batal</a>
                                    </div>
                                </div>
                            </form>
                        </div>

                        <!-- Kolom Banner (Di HP naik ke atas, di Laptop di kanan) -->
                        <div class="col-md-6 hero-section order-1 order-md-2">
                            <div class="hero-shape-1"></div>
                            <div class="hero-shape-2"></div>
                            <h4 class="fw-bold text-white mb-2 mb-md-4">Selamat Datang!</h4>
                            <h1 class="display-6 display-md-5 fw-bold text-white">Rental Motor<br>Ryokou</h1>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Panggil file JavaScript khusus halaman ini -->
    <script src="../js/2.membuat password baru.js"></script>
</body>
</html>

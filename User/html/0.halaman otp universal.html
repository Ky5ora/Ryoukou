<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi OTP - Rental Motor Ryokou</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/0.halaman otp universal.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-4">

    <!-- Floating OTP Toast (Diperbaiki posisinya agar aman di pojok kanan atas) -->
    <div id="otpToast" class="otp-toast-card shadow">
        <div class="d-flex align-items-center justify-content-between mb-1">
            <span class="badge bg-info text-dark small fw-bold">Kode OTP (Demo)</span>
            <small class="text-muted" style="font-size: 0.7rem;">Baru saja</small>
        </div>
        <p class="mb-1 small text-secondary">Kode OTP Anda:</p>
        <h3 id="displayOtpCode" class="fw-bold text-primary mb-0 tracking-widest">--- ---</h3>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10 col-xl-9">
                <div class="card auth-card">
                    <div class="row g-0">
                        
                        <!-- Kolom Form OTP Universal -->
                        <div class="col-md-6 p-4 p-md-5 d-flex flex-column justify-content-center order-2 order-md-1">
                            <h4 class="fw-bold mb-2">Verifikasi OTP</h4>
                            <p class="text-muted small mb-4">Masukkan 6 digit kode verifikasi yang terkirim ke akun Anda.</p>

                            <form id="formOtp">
                                <div class="mb-4">
                                    <label class="form-label fw-semibold small d-block mb-3">Kode OTP (6 Digit)</label>
                                    
                                    <!-- 6 Kotak Terpisah (Kotak 2-6 dikunci disabled secara default agar wajib dari kiri) -->
                                    <div class="otp-inputs-container d-flex justify-content-between gap-2 mb-2">
                                        <input type="text" class="form-control form-control-custom otp-box text-center fw-bold fs-4" maxlength="1" pattern="[0-9]" inputmode="numeric" required autocomplete="off">
                                        <input type="text" class="form-control form-control-custom otp-box text-center fw-bold fs-4" maxlength="1" pattern="[0-9]" inputmode="numeric" required autocomplete="off" disabled>
                                        <input type="text" class="form-control form-control-custom otp-box text-center fw-bold fs-4" maxlength="1" pattern="[0-9]" inputmode="numeric" required autocomplete="off" disabled>
                                        <input type="text" class="form-control form-control-custom otp-box text-center fw-bold fs-4" maxlength="1" pattern="[0-9]" inputmode="numeric" required autocomplete="off" disabled>
                                        <input type="text" class="form-control form-control-custom otp-box text-center fw-bold fs-4" maxlength="1" pattern="[0-9]" inputmode="numeric" required autocomplete="off" disabled>
                                        <input type="text" class="form-control form-control-custom otp-box text-center fw-bold fs-4" maxlength="1" pattern="[0-9]" inputmode="numeric" required autocomplete="off" disabled>
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-dark-custom w-100 mb-3">Verifikasi Sekarang</button>

                                <div class="text-center small">
                                    <p class="mb-0">Tidak menerima kode? <a href="#" id="resendOtp" class="link-blue">Kirim Ulang</a></p>
                                </div>
                            </form>
                        </div>

                        <!-- Kolom Banner Selamat Datang -->
                        <div class="col-md-6 hero-section order-1 order-md-2">
                            <div class="hero-shape-1"></div>
                            <div class="hero-shape-2"></div>
                            <h4 class="fw-bold text-white mb-2 mb-md-4">Selamat Datang!</h4>
                            <h1 class="display-6 display-md-5 fw-bold text-white">Rental Motor</h1>
                            <h1 class="display-6 display-md-5 fw-bold text-body-primary">Ryokou</h1>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Panggil file JS eksternal -->
    <script src="../js/0.halaman otp universal.js"></script>
</body>
</html>

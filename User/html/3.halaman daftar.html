<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - Rental Motor Ryokou</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
< class="d-flex align-items-center justify-content-center py-4">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10 col-xl-9">
                <div class="card auth-card">
                    <div class="row g-0">
                        
                        <div class="col-md-6 p-4 p-md-5 d-flex flex-column justify-content-center">
                            <h3 class="fw-bold mb-1">Daftar</h3>
                            <p class="text-muted small mb-4">Silahkan Buat Akun</p>

                            <!-- Tambahkan id="formDaftar" dan hapus action bawaan supaya dihandle JS -->
                            <form id="formDaftar">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold small">Username</label>
                                    <!-- Tambahkan id="inputUsernameDaftar" disini -->
                                    <input type="text" id="inputUsernameDaftar" class="form-control form-control-custom" placeholder="@contoh123" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold small">Password</label>
                                    <div class="password-container">
                                        <input type="password" id="inputSandiDaftar" class="form-control form-control-custom" placeholder="•••••" required>
                                        <button type="button" class="toggle-password" onclick="toggleSandi('inputSandiDaftar', 'imgMataDaftar1')">
                                            <img id="imgMataDaftar1" src="../assets/icon-mata-terbuka.svg" width="20" height="20" alt="Toggle Password">
                                        </button>
                                    </div>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label fw-semibold small">Confirm Password</label>
                                    <div class="password-container">
                                        <input type="password" id="inputKonfirmasiDaftar" class="form-control form-control-custom" placeholder="•••••" required>
                                        <button type="button" class="toggle-password" onclick="toggleSandi('inputKonfirmasiDaftar', 'imgMataDaftar2')">
                                            <img id="imgMataDaftar2" src="../assets/icon-mata-terbuka.svg" width="20" height="20" alt="Toggle Password">
                                        </button>
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-dark-custom w-100 mb-3">Daftar Sekarang</button>

                                <div class="text-center small">
                                    <p class="mb-0">Klik kembali ke halaman <a href="0.halaman login.html" class="link-blue">login</a></p>
                                </div>
                            </form>
                        </div>

                        <div class="col-md-6 hero-section">
                            <div class="hero-shape-1"></div>
                            <div class="hero-shape-2"></div>
                            <h4 class="fw-bold text-white mb-4">Selamat Datang!</h4>
                            <h1 class="display-5 fw-bold text-white">Rental Motor<br>Ryokou</h1>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>


    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const formDaftar = document.getElementById("formDaftar");

            if (formDaftar) {
                formDaftar.addEventListener("submit", function(event) {
                    event.preventDefault();

                    let inputNama = document.getElementById("inputUsernameDaftar").value;
                    localStorage.setItem("namaPengguna", inputNama);

                    // Pindah paksa ke halaman dashboard
                    window.location.href = "4.dashboard utama.html";
                });
            }
        });
    </script>
</body>
</html>

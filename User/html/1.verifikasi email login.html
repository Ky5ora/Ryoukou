<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Email - Rental Motor Ryokou</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/1.verifikasi email login.css">
</head>
<body class="d-flex align-items-center justify-content-center py-4">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10 col-xl-9">
                <div class="card auth-card">
                    <div class="row g-0">
                        
                        <div class="col-md-6 p-4 p-md-5 d-flex flex-column justify-content-center">
                            <h4 class="fw-bold mb-4">Verifikasi Email Anda</h4>

                            <form action="2.membuat password baru.html">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold small">Username:</label>
                                    <input type="text" class="form-control form-control-custom" placeholder="@contoh123" required>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label fw-semibold small">Email:</label>
                                    <input type="email" class="form-control form-control-custom" placeholder="contoh123@gmail.com" required>
                                </div>

                                <button type="submit" class="btn btn-dark-custom w-100">Konfirmasi</button>
                            </form>
                        </div>

                        <div class="col-md-6 hero-section">
                            <div class="hero-shape-1"></div>
                            <div class="hero-shape-2"></div>
                            <h4 class="fw-bold text-white mb-4">Selamat Datang!</h4>
                            <h1 class="display-5 fw-bold text-white">Rental Motor<br>Ryokou</h1>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>

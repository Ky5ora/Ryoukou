<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Email - Rental Motor Ryokou</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/1.verifikasi email login.css">
</head>
<body class="d-flex align-items-center justify-content-center py-4">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10 col-xl-9">
                <div class="card auth-card">
                    <div class="row g-0">
                        
                        <!-- Kolom Form Verifikasi (Di HP turun ke bawah, di Laptop di kiri) -->
                        <div class="col-md-6 p-4 p-md-5 d-flex flex-column justify-content-center order-2 order-md-1">
                            <h4 class="fw-bold mb-2">Verifikasi Email Anda</h4>
                            <p class="text-muted small mb-4">Masukkan email terdaftar untuk reset password.</p>

                            <form id="formVerifikasiEmail">
                                <div class="mb-4">
                                    <label class="form-label fw-semibold small">Email</label>
                                    <input type="email" id="inputEmailReset" class="form-control form-control-custom" placeholder="contoh123@gmail.com" maxlength="50" required>
                                </div>

                                <button type="submit" class="btn btn-dark-custom w-100 mb-3">Konfirmasi</button>

                                <div class="text-center small">
                                    <p class="mb-0">Kalau tidak jadi silahkan kembali ke halaman <a href="0.halaman login.html" class="link-blue">login</a></p>
                                </div>
                            </form>
                        </div>

                        <!-- Kolom Banner Selamat Datang (Di HP naik ke ATAS, di Laptop di kanan) -->
                        <div class="col-md-6 hero-section order-1 order-md-2">
                            <div class="hero-shape-1"></div>
                            <div class="hero-shape-2"></div>
                            <h4 class="fw-bold text-white mb-2 mb-md-4">Selamat Datang!</h4>
                            <h1 class="display-6 display-md-5 fw-bold text-white">Rental Motor<br>Ryokou</h1>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Panggil file JavaScript eksternal -->
    <script src="../js/1.verifikasi email login.js"></script>
</body>
</html>

<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Masuk Admin | RYOKOU</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/auth.css">
  </head>
  
  <body>
    <main class="auth-page">
      <section class="auth-brand">
        <div class="circle circle-one"></div>
        <div class="circle circle-two"></div>
        <img class="auth-brand-logo" src="../assets/ryokou-logo.png" alt="Logo RYOKOU">
        <h1 class="welcome">Selamat Datang!!</h1>
        <p class="brand-title">Rental Motor<span>Ryokou</span></p>
      </section>
      <section class="auth-panel">
        <div class="auth-form">
          <h2>Masuk Admin</h2>
          <p class="auth-subtitle">
            Silahkan Masuk Ke Akun Admin/Owner Rental anda.
          </p>
          <form data-demo="login">
            <div class="field">
              <label for="email">Masukkan Email</label
              ><input
                id="email"
                type="email"
                placeholder="admin001@gmail.com"
                required
              />
            </div>
            <div class="field">
              <label for="password">Password</label
              ><input id="password" type="password" required />
            </div>
            <label class="password-toggle"
              ><input type="checkbox" data-toggle="#password" /> Tampilkan
              Sandi</label
            >
            <button class="auth-btn" type="submit">LOGIN SEKARANG</button
            ><a
              href="verify-email.html"
              class="auth-btn secondary"
              style="
                display: flex;
                align-items: center;
                justify-content: center;
              "
              >Lupa Password?</a
            >
          </form>
        </div>
      </section>
    </main>
    <script src="../js/auth.js"></script>
  </body>
</html>

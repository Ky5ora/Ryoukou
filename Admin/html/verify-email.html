<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Verifikasi Email | RYOKOU</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/auth.css">
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-brand">
        <div class="circle circle-one"></div>
        <div class="circle circle-two"></div>
        <img class="auth-brand-logo" src="../assets/ryokou-logo.png" alt="Logo RYOKOU">
        <h1 class="welcome">Selamat Datang!</h1>
        <p class="brand-title">Rental Motor<span>Ryokou</span></p>
      </section>
      <section class="auth-panel">
        <div class="auth-form">
          <h2>Verifikasi Email Anda</h2>
          <p class="auth-subtitle">&nbsp;</p>
          <form data-demo="verify">
            <div class="field">
              <label for="username">Username:</label
              ><input id="username" placeholder="@admin123" required />
            </div>
            <div class="field">
              <label for="email">Email:</label
              ><input
                id="email"
                type="email"
                placeholder="admin123@gmail.com"
                required
              />
            </div>
            <button class="auth-btn" type="submit" style="margin-top: 16px">
              Konfirmasi
            </button>
          </form>
        </div>
      </section>
    </main>
    <script src="../js/auth.js"></script>
  </body>
</html>
